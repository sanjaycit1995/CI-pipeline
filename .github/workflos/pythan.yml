name: "python CI"

  On:
    push:
      branches:
        - master
    
job:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install dependencies
        run: 
          python -m pip install --upgrade pip
          
      - name: Run application
        run:  python app.py

          